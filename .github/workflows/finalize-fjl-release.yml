name: Finalize FJL Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag containing the FJL artifacts
        required: true
        default: mod-assets-2026-08-08-faded-java-loader-0.3.0
      key_id:
        description: Trusted FJL publisher key id
        required: true
        default: faded-fjl-release-2026-08-r4

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      FJL_KEY_ID: ${{ inputs.key_id }}
      FJL_RELEASE_PRIVATE_KEY_PEM_B64: ${{ secrets.FJL_RELEASE_PRIVATE_KEY_PEM_B64 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release assets
        run: |
          set -euo pipefail
          test -n "$FJL_RELEASE_PRIVATE_KEY_PEM_B64"
          rm -rf release
          mkdir -p release
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release \
            --clobber

      - name: Install signing dependency
        run: python -m pip install --upgrade cryptography

      - name: Sign release and write installer catalog
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          public_keys = {
              "faded-fjl-release-2026-08-r3": "MCowBQYDK2VwAyEAt991v7X7VW6xwzEs2QuvTDH3w8KwkS36MDVRrVuVV4w=",
              "faded-fjl-release-2026-08-r4": "MCowBQYDK2VwAyEAxlAGcspcdZtnOYnvTvpqaibuZj3/Qi29COf/eJrGb94=",
          }

          key_id = os.environ["FJL_KEY_ID"]
          expected_public = public_keys.get(key_id)
          if not expected_public:
              raise SystemExit(f"Unknown FJL key id: {key_id}")

          expected_fp = hashlib.sha256(base64.b64decode(expected_public)).hexdigest()
          encoded_pem = os.environ.get("FJL_RELEASE_PRIVATE_KEY_PEM_B64", "")
          if not encoded_pem:
              raise SystemExit("FJL_RELEASE_PRIVATE_KEY_PEM_B64 is not configured")

          pem = bytearray(base64.b64decode(encoded_pem, validate=True))
          try:
              release_dir = Path("release").resolve()
              manifest_path = release_dir / "release-manifest.json"
              if not manifest_path.is_file():
                  raise SystemExit("release-manifest.json is missing from the release assets")
              manifest = json.loads(manifest_path.read_text(encoding="utf-8-sig"))
              version = str(manifest.get("version") or "").strip()
              if not version:
                  raise SystemExit("release-manifest.json is missing version")
              catalog_name = f"installer-catalog-{version}.json"
              catalog_path = release_dir / catalog_name
              base_url = (
                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
                  f"/releases/download/{os.environ['RELEASE_TAG']}"
              )
              cmd = [
                  sys.executable,
                  "scripts/sign-release.py",
                  "--release-dir",
                  str(release_dir),
                  "--manifest",
                  str(manifest_path),
                  "--release-base-url",
                  base_url,
                  "--key-id",
                  key_id,
                  "--expected-public-sha256",
                  expected_fp,
                  "--output",
                  str(catalog_path),
              ]
              # Private key only on stdin; never in argv or env for the child.
              completed = subprocess.run(
                  cmd,
                  input=bytes(pem),
                  check=False,
              )
              if completed.returncode != 0:
                  raise SystemExit(f"sign-release.py failed with exit {completed.returncode}")
              if not catalog_path.is_file():
                  raise SystemExit(f"Expected catalog was not written: {catalog_name}")
              print(f"Signed catalog ready: {catalog_name}")
              print(f"CATALOG_PATH={catalog_path}")
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
                  env_file.write(f"FJL_CATALOG_PATH={catalog_path}\n")
                  env_file.write(f"FJL_CATALOG_NAME={catalog_name}\n")
          finally:
              for index in range(len(pem)):
                  pem[index] = 0
          PY

      - name: Upload finalized manifest and catalog
        run: |
          set -euo pipefail
          # gh --clobber can still 422 (ReleaseAsset.name already exists) on some runners.
          for asset in release-manifest.json checksums.sha256 "$FJL_CATALOG_NAME"; do
            gh release delete-asset "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          done
          gh release upload "$RELEASE_TAG" \
            release/release-manifest.json \
            release/checksums.sha256 \
            "$FJL_CATALOG_PATH" \
            --repo "$GITHUB_REPOSITORY"
