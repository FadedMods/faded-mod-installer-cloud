name: Sync Outback Steakhouse Nexus catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  push:
    branches: [main]
    paths:
      - manifest.json
      - scripts/sync_outback_catalog.py
      - scripts/test_sync_outback_catalog.py
      - .github/workflows/sync-outback-catalog.yml

permissions:
  contents: write

concurrency:
  group: outback-nexus-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test exact pack resolution
        run: python3 -m unittest discover -s scripts -p 'test_sync_outback_catalog.py'
      - name: Resolve public Nexus pack
        run: python3 scripts/sync_outback_catalog.py
      - name: Check existing catalog safety
        run: python3 scripts/validate_manifests.py
      - name: Publish changed Outback catalog
        run: |
          if git diff --quiet -- manifests/outback-steakhouse.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifests/outback-steakhouse.json
          git commit -m 'Sync Outback Steakhouse catalog from Nexus'
          git push origin HEAD:main
