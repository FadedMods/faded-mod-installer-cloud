name: Validate Schedule I catalog

on:
  pull_request:
    paths:
      - schedule-i-manifest.json
      - schedule-i/**
      - scripts/validate_schedule_i_catalog.py
      - scripts/test_validate_schedule_i_catalog.py
      - .github/workflows/validate-schedule-i.yml
  push:
    branches: [main]
    paths:
      - schedule-i-manifest.json
      - schedule-i/**
      - scripts/validate_schedule_i_catalog.py
      - scripts/test_validate_schedule_i_catalog.py
      - .github/workflows/validate-schedule-i.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography>=43'
      - run: python -m unittest discover -s scripts -p test_validate_schedule_i_catalog.py
      - run: python scripts/validate_schedule_i_catalog.py schedule-i-manifest.json
      - name: Validate all full Schedule I catalogs
        shell: bash
        run: |
          for catalog in schedule-i/*-manifest.json; do
            python scripts/validate_schedule_i_catalog.py "$catalog"
          done
